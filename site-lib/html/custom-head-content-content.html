<!--
RP9 / Obsidian Webpage Export
Automatic navigation buttons at the top and bottom of every exported document.
-->

<style>
  .rp9-back-navigation {
    width: 100%;
    display: flex;
    justify-content: center;
    box-sizing: border-box;
    margin: 1.5rem 0;
  }

  .rp9-back-button {
    appearance: none;
    -webkit-appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    padding: 0.65rem 1.1rem;
    border: 1px solid var(--background-modifier-border, #888);
    border-radius: 8px;
    background: var(--interactive-normal, #f2f2f2);
    color: var(--text-normal, #222);
    font: inherit;
    line-height: 1;
    cursor: pointer;
    transition:
      background-color 120ms ease,
      border-color 120ms ease,
      transform 120ms ease;
  }

  .rp9-back-button:hover {
    background: var(--interactive-hover, #e4e4e4);
    transform: translateY(-1px);
  }

  .rp9-back-button:focus-visible {
    outline: 2px solid var(--interactive-accent, #7c3aed);
    outline-offset: 3px;
  }
</style>

<script>
  (() => {
    "use strict";

    const CONTAINER_CLASS = "rp9-back-navigation";
    const BUTTON_CLASS = "rp9-back-button";

    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
        return;
      }

      // Fallback when the page was opened directly and has no browser history.
      const fallback =
        document.querySelector(
          'a.file-tree-item[href], a.nav-file-title[href], a[href$="index.html"]'
        );

      if (fallback instanceof HTMLAnchorElement) {
        window.location.href = fallback.href;
      }
    }

    function createBackNavigation(position) {
      const container = document.createElement("nav");
      container.className = CONTAINER_CLASS;
      container.dataset.position = position;
      container.setAttribute("aria-label", "Page navigation");

      const button = document.createElement("button");
      button.className = BUTTON_CLASS;
      button.type = "button";
      button.textContent = "← Back";
      button.setAttribute("aria-label", "Gå tillbaka till föregående sida");
      button.addEventListener("click", goBack);

      container.appendChild(button);
      return container;
    }

    function findDocumentContainer() {
      const selectors = [
        ".markdown-preview-view",
        ".markdown-rendered",
        ".document-container",
        ".document",
        "main article",
        "main"
      ];

      for (const selector of selectors) {
        const element = document.querySelector(selector);
        if (element) return element;
      }

      return null;
    }

    function installBackButtons() {
      if (document.querySelector(`.${CONTAINER_CLASS}`)) return;

      const documentContainer = findDocumentContainer();
      if (!documentContainer) return;

      const topButton = createBackNavigation("top");
      const bottomButton = createBackNavigation("bottom");

      documentContainer.prepend(topButton);
      documentContainer.append(bottomButton);
    }

    function initialize() {
      installBackButtons();

      // Webpage Export may replace document content during internal navigation.
      const observer = new MutationObserver(() => {
        installBackButtons();
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initialize, { once: true });
    } else {
      initialize();
    }
  })();
</script>
