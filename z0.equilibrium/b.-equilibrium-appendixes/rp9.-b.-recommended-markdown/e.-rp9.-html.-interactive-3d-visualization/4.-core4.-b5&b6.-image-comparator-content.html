<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RP9 B5-B6 Image Comparator</title>
  <style>
    :root{
      --bg:#050505;
      --panel:#111;
      --line:#333;
      --text:#e8e8e8;
      --muted:#aaa;
      --accent:#d0d0d0;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
    }
    main{
      max-width:1280px;
      margin:0 auto;
      padding:18px;
    }
    h1{
      margin:0 0 10px 0;
      font-size:22px;
      letter-spacing:0.02em;
    }
    .sub{
      color:var(--muted);
      margin-bottom:14px;
      font-size:14px;
    }
    .layout{
      display:grid;
      grid-template-columns:1fr 340px;
      gap:16px;
      align-items:start;
    }
    .viewer{
      background:#000;
      border:1px solid var(--line);
      border-radius:10px;
      overflow:auto;
      min-height:640px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }
    canvas{
      image-rendering:auto;
      background:#000;
      display:block;
      max-width:none;
    }
    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:10px;
      padding:14px;
    }
    .group{
      border-top:1px solid var(--line);
      padding-top:12px;
      margin-top:12px;
    }
    .group:first-child{
      border-top:0;
      padding-top:0;
      margin-top:0;
    }
    label{
      display:block;
      font-size:13px;
      color:var(--muted);
      margin-bottom:6px;
    }
    input[type=range], select, button{
      width:100%;
    }
    input[type=range]{
      accent-color:#d0d0d0;
    }
    select, button{
      background:#050505;
      color:var(--text);
      border:1px solid #555;
      border-radius:8px;
      padding:9px;
      font-size:14px;
    }
    button{
      cursor:pointer;
    }
    .value{
      float:right;
      color:var(--text);
      font-variant-numeric:tabular-nums;
    }
    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .stats{
      font-family:Consolas, Monaco, monospace;
      font-size:12px;
      line-height:1.5;
      color:#ddd;
      white-space:pre-wrap;
    }
    .note{
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }
    .modehint{
      color:var(--muted);
      font-size:12px;
      margin-top:8px;
      min-height:34px;
    }
    @media(max-width:980px){
      .layout{grid-template-columns:1fr;}
      .viewer{min-height:420px;}
    }
  </style>
</head>
<body>
<main>
  <h1>RP9 B5-B6 Image Comparator</h1>
  <div class="sub">Standalone HTML. Originalbilderna ligger inbakade i filen. Ingen extern path behovs.</div>
  <div class="layout">
    <div class="viewer">
      <canvas id="canvas"></canvas>
    </div>
    <aside class="panel">
      <div class="group">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="fade">Fade</option>
          <option value="difference" selected>Difference</option>
          <option value="highlight">Highlight</option>
          <option value="swipe">Swipe</option>
          <option value="checker">Checkerboard</option>
          <option value="blink">Blink</option>
        </select>
        <div id="modehint" class="modehint"></div>
      </div>
      <div class="group">
        <label for="mix">Mix <span id="mixVal" class="value">50%</span></label>
        <input id="mix" type="range" min="0" max="100" value="50">
      </div>
      <div class="group">
        <label for="gamma">Gamma / difference lift <span id="gammaVal" class="value">0.60</span></label>
        <input id="gamma" type="range" min="0.20" max="3.00" step="0.05" value="0.60">
      </div>
      <div class="group">
        <label for="contrast">Contrast <span id="contrastVal" class="value">180%</span></label>
        <input id="contrast" type="range" min="50" max="500" step="5" value="180">
      </div>
      <div class="group">
        <label for="threshold">Threshold <span id="thresholdVal" class="value">4</span></label>
        <input id="threshold" type="range" min="0" max="64" step="1" value="4">
      </div>
      <div class="group">
        <label for="zoom">Zoom <span id="zoomVal" class="value">80%</span></label>
        <input id="zoom" type="range" min="25" max="200" step="5" value="80">
      </div>
      <div class="group row">
        <button id="reset">Reset</button>
        <button id="exportPng">Export PNG</button>
      </div>
      <div class="group">
        <label><input id="crosshair" type="checkbox" checked> Show center crosshair</label>
        <label><input id="bbox" type="checkbox" checked> Show difference bounding box</label>
      </div>
      <div class="group">
        <div class="stats" id="stats">Loading...</div>
      </div>
      <div class="group note">
        Difference visar absolut pixelavvikelse. Gamma och kontrast andrar endast visualisering av avvikelsen, inte originalgeometrin.
      </div>
    </aside>
  </div>
</main>

QIECAAAECBAgQIEDgYgLeRYAAAQIECBAgsC4BGyDrGk/RECBAYFsC6iFAgAABAgQIECBAgAABAgTWLyBCAqsW+P8AAAD//388Y8cAAAAGSURBVAMA4CPwLHxyX7EAAAAASUVORK5CYII=";
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const modeEl = document.getElementById('mode');
const mixEl = document.getElementById('mix');
const gammaEl = document.getElementById('gamma');
const contrastEl = document.getElementById('contrast');
const thresholdEl = document.getElementById('threshold');
const zoomEl = document.getElementById('zoom');
const crosshairEl = document.getElementById('crosshair');
const bboxEl = document.getElementById('bbox');
const statsEl = document.getElementById('stats');
const modeHintEl = document.getElementById('modehint');
let imgA = new Image();
let imgB = new Image();
let dataA = null;
let dataB = null;
let blinkState = false;
let blinkTimer = null;
let diffStats = null;
function clamp(v){ return Math.max(0, Math.min(255, v)); }
function loadImage(img, src){
  return new Promise((resolve, reject) => {
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function setSize(){
  const w = imgA.naturalWidth;
  const h = imgA.naturalHeight;
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = Math.round(w * Number(zoomEl.value) / 100) + 'px';
  canvas.style.height = Math.round(h * Number(zoomEl.value) / 100) + 'px';
}
function captureImageData(img){
  const off = document.createElement('canvas');
  off.width = canvas.width;
  off.height = canvas.height;
  const octx = off.getContext('2d', { willReadFrequently: true });
  octx.drawImage(img, 0, 0);
  return octx.getImageData(0, 0, off.width, off.height);
}
function computeStats(){
  const a = dataA.data;
  const b = dataB.data;
  const threshold = Number(thresholdEl.value);
  let changed = 0;
  let sumSq = 0;
  let maxDiff = 0;
  let minX = canvas.width;
  let minY = canvas.height;
  let maxX = -1;
  let maxY = -1;
  for(let y = 0; y < canvas.height; y++){
    for(let x = 0; x < canvas.width; x++){
      const i = (y * canvas.width + x) * 4;
      const dr = Math.abs(a[i] - b[i]);
      const dg = Math.abs(a[i + 1] - b[i + 1]);
      const db = Math.abs(a[i + 2] - b[i + 2]);
      const d = Math.max(dr, dg, db);
      maxDiff = Math.max(maxDiff, d);
      sumSq += dr * dr + dg * dg + db * db;
      if(d > threshold){
        changed++;
        if(x < minX) minX = x;
        if(y < minY) minY = y;
        if(x > maxX) maxX = x;
        if(y > maxY) maxY = y;
      }
    }
  }
  const pixels = canvas.width * canvas.height;
  const rms = Math.sqrt(sumSq / (pixels * 3));
  diffStats = { pixels, changed, percent: changed * 100 / pixels, rms, maxDiff, minX, minY, maxX, maxY };
}
function updateLabels(){
  document.getElementById('mixVal').textContent = mixEl.value + '%';
  document.getElementById('gammaVal').textContent = Number(gammaEl.value).toFixed(2);
  document.getElementById('contrastVal').textContent = contrastEl.value + '%';
  document.getElementById('thresholdVal').textContent = thresholdEl.value;
  document.getElementById('zoomVal').textContent = zoomEl.value + '%';
}
function updateHint(){
  const mode = modeEl.value;
  const hints = {
    fade:'Slidern korsfadar B5 och B6.',
    difference:'Identiska pixlar blir svarta. Skillnader lyfts med gamma och kontrast.',
    highlight:'B5 visas cyan, B6 visas magenta. Overlapp blir ljus.',
    swipe:'Slidern flyttar en vertikal snittlinje mellan B5 och B6.',
    checker:'Rutnat delar ytan mellan B5 och B6.',
    blink:'Vaxlar snabbt mellan B5 och B6. Mix-slidern ignoreras.'
  };
  modeHintEl.textContent = hints[mode] || '';
}
function drawOverlays(){
  if(crosshairEl.checked){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.moveTo(0, canvas.height / 2);
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();
    ctx.restore();
  }
  if(bboxEl.checked && diffStats && diffStats.maxX >= 0){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.strokeRect(diffStats.minX, diffStats.minY, diffStats.maxX - diffStats.minX + 1, diffStats.maxY - diffStats.minY + 1);
    ctx.restore();
  }
}
function render(){
  if(!dataA || !dataB) return;
  updateLabels();
  updateHint();
  const mode = modeEl.value;
  const mix = Number(mixEl.value) / 100;
  const gamma = Number(gammaEl.value);
  const contrast = Number(contrastEl.value) / 100;
  const out = ctx.createImageData(canvas.width, canvas.height);
  const a = dataA.data;
  const b = dataB.data;
  const o = out.data;
  for(let y = 0; y < canvas.height; y++){
    for(let x = 0; x < canvas.width; x++){
      const i = (y * canvas.width + x) * 4;
      let r = 0;
      let g = 0;
      let bl = 0;
      if(mode === 'fade'){
        r = a[i] * (1 - mix) + b[i] * mix;
        g = a[i + 1] * (1 - mix) + b[i + 1] * mix;
        bl = a[i + 2] * (1 - mix) + b[i + 2] * mix;
      } else if(mode === 'difference'){
        r = Math.pow(Math.abs(a[i] - b[i]) / 255, gamma) * 255 * contrast;
        g = Math.pow(Math.abs(a[i + 1] - b[i + 1]) / 255, gamma) * 255 * contrast;
        bl = Math.pow(Math.abs(a[i + 2] - b[i + 2]) / 255, gamma) * 255 * contrast;
      } else if(mode === 'highlight'){
        const lumA = (a[i] + a[i + 1] + a[i + 2]) / 3;
        const lumB = (b[i] + b[i + 1] + b[i + 2]) / 3;
        r = lumB * 1.25;
        g = (lumA + lumB) * 0.75;
        bl = lumA * 1.25;
      } else if(mode === 'swipe'){
        const useB = x < canvas.width * mix;
        r = useB ? b[i] : a[i];
        g = useB ? b[i + 1] : a[i + 1];
        bl = useB ? b[i + 2] : a[i + 2];
      } else if(mode === 'checker'){
        const cell = 64;
        const useB = (Math.floor(x / cell) + Math.floor(y / cell)) % 2 === 0;
        r = useB ? b[i] : a[i];
        g = useB ? b[i + 1] : a[i + 1];
        bl = useB ? b[i + 2] : a[i + 2];
      } else if(mode === 'blink'){
        r = blinkState ? b[i] : a[i];
        g = blinkState ? b[i + 1] : a[i + 1];
        bl = blinkState ? b[i + 2] : a[i + 2];
      }
      o[i] = clamp(r);
      o[i + 1] = clamp(g);
      o[i + 2] = clamp(bl);
      o[i + 3] = 255;
    }
  }
  ctx.putImageData(out, 0, 0);
  if(mode === 'swipe'){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(canvas.width * mix, 0);
    ctx.lineTo(canvas.width * mix, canvas.height);
    ctx.stroke();
    ctx.restore();
  }
  drawOverlays();
  if(diffStats){
    statsEl.textContent = [
      'Image A: B5__N5.png',
      'Image B: B6__N5.png',
      'Size   : ' + canvas.width + ' x ' + canvas.height,
      'Pixels : ' + diffStats.pixels,
      'Changed pixels > threshold: ' + diffStats.changed,
      'Changed percent: ' + diffStats.percent.toFixed(6) + '%',
      'RMS difference : ' + diffStats.rms.toFixed(6),
      'Max difference : ' + diffStats.maxDiff,
      'BBox: ' + (diffStats.maxX >= 0 ? diffStats.minX + ',' + diffStats.minY + ' -> ' + diffStats.maxX + ',' + diffStats.maxY : 'none')
    ].join('\n');
  }
}
function updateBlink(){
  if(blinkTimer){
    clearInterval(blinkTimer);
    blinkTimer = null;
  }
  if(modeEl.value === 'blink'){
    blinkTimer = setInterval(() => {
      blinkState = !blinkState;
      render();
    }, 220);
  }
}
function refreshStatsAndRender(){
  computeStats();
  render();
}
for(const el of [modeEl, mixEl, gammaEl, contrastEl, thresholdEl, zoomEl, crosshairEl, bboxEl]){
  el.addEventListener('input', () => {
    if(el === zoomEl){
      canvas.style.width = Math.round(canvas.width * Number(zoomEl.value) / 100) + 'px';
      canvas.style.height = Math.round(canvas.height * Number(zoomEl.value) / 100) + 'px';
    }
    if(el === thresholdEl) computeStats();
    if(el === modeEl) updateBlink();
    render();
  });
  el.addEventListener('change', () => {
    if(el === thresholdEl) computeStats();
    if(el === modeEl) updateBlink();
    render();
  });
}
document.getElementById('reset').addEventListener('click', () => {
  modeEl.value = 'difference';
  mixEl.value = 50;
  gammaEl.value = 0.60;
  contrastEl.value = 180;
  thresholdEl.value = 4;
  zoomEl.value = 80;
  crosshairEl.checked = true;
  bboxEl.checked = true;
  setSize();
  computeStats();
  updateBlink();
  render();
});
document.getElementById('exportPng').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'RP9_B5_B6_comparison_export.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
Promise.all([loadImage(imgA, IMG_A_SRC), loadImage(imgB, IMG_B_SRC)]).then(() => {
  if(imgA.naturalWidth !== imgB.naturalWidth || imgA.naturalHeight !== imgB.naturalHeight){
    alert('Bilderna har olika pixelstorlek. Jamforelsen fortsatter men resultatet kan bli fel.');
  }
  setSize();
  dataA = captureImageData(imgA);
  dataB = captureImageData(imgB);
  computeStats();
  updateBlink();
  render();
}).catch(err => {
  statsEl.textContent = 'Fel vid bildinlasning: ' + err;
});
</script>
